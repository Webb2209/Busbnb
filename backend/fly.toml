# fly.toml — BusBnB Backend
# Docs: https://fly.io/docs/reference/configuration/

app = "busbnb-api"
primary_region = "jnb"   # Johannesburg — lowest latency for Kenya

[build]
  dockerfile = "Dockerfile"

[env]
  PORT     = "4000"
  NODE_ENV = "production"

# ─── HTTP Service ─────────────────────────────────────────────────────────────
[http_service]
  internal_port       = 4000
  force_https         = true
  auto_stop_machines  = false  # BullMQ workers MUST stay alive — never sleep
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 25
    soft_limit = 20

# ─── Health Check ─────────────────────────────────────────────────────────────
[[services.tcp_checks]]
  interval    = "15s"
  timeout     = "2s"
  grace_period = "10s"

[[http_service.checks]]
  grace_period  = "30s"   # Allow time for prisma migrate deploy on first boot
  interval      = "15s"
  method        = "GET"
  path          = "/health"
  timeout       = "10s"

# ─── VM ───────────────────────────────────────────────────────────────────────
[[vm]]
  memory   = "512mb"
  cpu_kind = "shared"
  cpus     = 1
