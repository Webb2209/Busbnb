version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: busbnb_user
      POSTGRES_PASSWORD: busbnb_password
      POSTGRES_DB: busbnb_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U busbnb_user -d busbnb_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://busbnb_user:busbnb_password@postgres:5432/busbnb_db?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=fallback_secret_for_docker_change_me
      - JWT_REFRESH_SECRET=fallback_refresh_secret_change_me
      - FRONTEND_URL=http://localhost:3000
      - MPESA_ENV=sandbox
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # This automatically runs DB migrations before starting PM2
    command: sh -c "npx prisma migrate deploy && npm run start:prod"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
