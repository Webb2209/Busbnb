name: BusBnB CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ─── Secret Scanning ─────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history required for diff-based scanning

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # ─── Backend ─────────────────────────────────────────────────────────────────
  backend-checks:
    name: Backend (Lint · Build · Audit · Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: busbnb_user
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: busbnb_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://busbnb_user:testpassword@localhost:5432/busbnb_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci_test_jwt_secret_not_for_production' }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || 'ci_test_refresh_secret_not_for_production' }}
      MPESA_CALLBACK_SECRET: ci_test_callback_secret
      MPESA_ENV: sandbox
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Prisma Generate
        run: npx prisma generate

      - name: Build TypeScript
        run: npm run build

      - name: Run database migrations (test DB)
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm test

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

  # ─── Frontend ────────────────────────────────────────────────────────────────
  frontend-checks:
    name: Frontend (Lint · Build · Audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
